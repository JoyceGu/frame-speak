<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame &amp; Speak</title>
<style>
:root{
  color-scheme:light;
  --bg:#E9EDEA; --surface:#FFFFFF; --surface-2:#F4F6F4; --ink:#15302A; --muted:#5A6D67; --line:#D3DBD7;
  --accent:#3346D3; --accent-ink:#FFFFFF; --accent-soft:#E3E6FB;
  --marker:#F6DD55; --marker-ink:#2A2503;
  --link:#D2462E; --stress-bg:#E3E6FB;
  --good:#1F7A4D; --bad:#B3261E;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --display:"Avenir Next", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  --body:system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1513; --surface:#172019; --surface-2:#1C2622; --ink:#E4ECE8; --muted:#94A7A0; --line:#2A3833;
    --accent:#8E9CFF; --accent-ink:#0D1030; --accent-soft:#232A55;
    --marker:#8A7A1C; --marker-ink:#FFF7C8; --link:#FF8F6B; --stress-bg:#2A3263; --good:#5CC98F; --bad:#FF8A80;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1513; --surface:#172019; --surface-2:#1C2622; --ink:#E4ECE8; --muted:#94A7A0; --line:#2A3833;
  --accent:#8E9CFF; --accent-ink:#0D1030; --accent-soft:#232A55;
  --marker:#8A7A1C; --marker-ink:#FFF7C8; --link:#FF8F6B; --stress-bg:#2A3263; --good:#5CC98F; --bad:#FF8A80;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding:14px}
#root{display:grid;gap:12px;max-width:820px;margin:0 auto}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:22px}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:17px}
.brand b span{background:var(--marker);color:var(--marker-ink);padding:0 4px;border-radius:3px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:7px 14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled,.chip:disabled,select:disabled{opacity:.5;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:13px;max-width:100%}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;padding:3px 10px;border-radius:999px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}

.topic{display:grid;gap:8px}
.topic .q{font-family:var(--display);font-size:clamp(20px,4vw,26px);font-weight:700;letter-spacing:-.01em}
.topic .ctx{color:var(--muted);font-size:14px}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.rail{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rail .node{font-size:12px;padding:4px 9px;border-radius:5px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2)}
.rail .node.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.rail .arrow{color:var(--muted);font-size:12px}

.steps{display:grid;gap:10px}
.step{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:grid;gap:8px}
.step.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.step-head{display:flex;gap:10px;align-items:baseline}
.step-head .n{font-family:var(--mono);font-size:12px;color:var(--accent)}
.step-head h3{font-size:17px}
.step .prompt{font-size:15px;color:var(--muted)}
.sphr{display:flex;flex-wrap:wrap;gap:6px}
.sphr span{background:var(--surface-2);border-radius:6px;padding:4px 10px;font-size:13.5px}
.wc{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;min-height:1em}

.status{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-basis:100%}
.status.err{color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}

.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.score{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.score .v{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.score .v small{font-size:13px;color:var(--muted);font-weight:500}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.fb-sec{display:grid;gap:8px}
.fb-sec h3{font-size:17px}
ul.clean{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fix{border-left:3px solid var(--line);padding:4px 0 4px 12px;display:grid;gap:3px}
.fix .old{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--muted)}
.fix .new{font-weight:700}
.fix small{color:var(--muted)}
.polished{background:var(--surface-2);border-radius:8px;padding:14px 16px;line-height:1.75}
mark{background:var(--marker);color:var(--marker-ink);padding:0 2px;border-radius:2px}
.script{display:grid;gap:4px}
.sent{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:8px}
.sent.playing{background:var(--accent-soft)}
.sent .play{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:11px;display:grid;place-items:center;padding:0}
.sent .play:hover{border-color:var(--accent);color:var(--accent)}
.sent .txt{font-size:18px;line-height:1.9;word-spacing:.08em}
.lk{color:var(--link);font-weight:700;margin-inline:-.12em;display:inline-block;transform:translateY(.28em);font-size:1.1em;line-height:0}
.ps{color:var(--muted);margin-inline:.25em;font-weight:400}
.st{background:var(--stress-bg);border-radius:3px;padding:0 2px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.word{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;align-content:start}
.word .w{font-family:var(--display);font-weight:700;font-size:17px}
.word .m{font-size:14px}
.word .ex{font-size:13px;font-style:italic;color:var(--muted)}
.word .acts button{border:0;background:transparent;color:var(--accent);font-size:13px;padding:0;font-weight:700}

.ctype{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);flex-basis:100%}
.ctitle{flex:1 1 auto}
.cbig{fill:var(--ink);font-size:26px;font-weight:700;font-family:var(--display)}
.dwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.dwrap svg.donut{width:220px;max-width:100%;flex:none}
.dlist{list-style:none;margin:0;padding:0;display:grid;gap:8px;flex:1 1 200px}
.dlist li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.dlist b{font-variant-numeric:tabular-nums}
.lbl{fill:var(--ink)!important;font-weight:700!important}
.ctip-read{margin:0;font-size:14px;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.chart{margin:0;display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.chead{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:baseline}
.chead .legend{margin-left:auto}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.cbox{position:relative}
.cbox svg{display:block;width:100%;height:auto;overflow:visible}
.cgrid{stroke:var(--line);stroke-width:1}
.cax{stroke:var(--muted);stroke-width:1}
.ctick{fill:var(--muted);font-size:12px;font-family:var(--body);font-variant-numeric:tabular-nums}
.cl{fill:var(--ink);font-size:14px;font-family:var(--body)}
.cv{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--body);font-variant-numeric:tabular-nums}
.cv.sm{font-size:11px;font-weight:400;fill:var(--muted)}
.cann{fill:var(--muted);font-size:12px;font-family:var(--body)}
.cmark,.cref{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.ccross{stroke:var(--muted);stroke-width:1}
.ctip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:120px;display:grid;gap:2px}
.ctip .tt{color:var(--muted);font-size:12px}
.cdata summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:700}
.tscroll{overflow-x:auto;margin-top:8px}
.ctable{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.ctable th,.ctable td{padding:4px 12px 4px 0;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.ctable th:first-child,.ctable td:first-child{text-align:left}
@media (max-width:560px){
  body{padding:10px}
  .scores{grid-template-columns:repeat(2,1fr)}
  .panel{padding:14px}
  .sent .txt{font-size:17px}
}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
