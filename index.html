<title>Frame &amp; Speak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Noto+Sans+SC:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#E9EDEA; --surface:#FFFFFF; --surface-2:#F4F6F4; --ink:#15302A; --muted:#5A6D67; --line:#D3DBD7;
  --accent:#3346D3; --accent-ink:#FFFFFF; --accent-soft:#E3E6FB;
  --marker:#F6DD55; --marker-ink:#2A2503;
  --link:#D2462E; --stress-bg:#E3E6FB;
  --good:#1F7A4D; --bad:#B3261E;
  --display:"Bricolage Grotesque", "Noto Sans SC", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1513; --surface:#172019; --surface-2:#1C2622; --ink:#E4ECE8; --muted:#94A7A0; --line:#2A3833;
    --accent:#8E9CFF; --accent-ink:#0D1030; --accent-soft:#232A55;
    --marker:#8A7A1C; --marker-ink:#FFF7C8;
    --link:#FF8F6B; --stress-bg:#2A3263;
    --good:#5CC98F; --bad:#FF8A80;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1513; --surface:#172019; --surface-2:#1C2622; --ink:#E4ECE8; --muted:#94A7A0; --line:#2A3833;
  --accent:#8E9CFF; --accent-ink:#0D1030; --accent-soft:#232A55;
  --marker:#8A7A1C; --marker-ink:#FFF7C8;
  --link:#FF8F6B; --stress-bg:#2A3263;
  --good:#5CC98F; --bad:#FF8A80;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:820px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px 12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
.brand h1 span{background:var(--marker);color:var(--marker-ink);padding:0 4px;border-radius:3px}
.brand small{color:var(--muted);font-size:14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 16px;border-radius:999px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.seg.sm button{padding:3px 10px;font-size:12px}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:8px 18px}
.mode{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;text-align:left;display:grid;gap:2px}
.mode b{font-family:var(--display);font-size:18px}
.mode small{color:var(--muted);font-size:13px}
.mode[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line);font-weight:400}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}
textarea::placeholder{color:var(--muted)}

.topic{display:grid;gap:10px}
.topic .q{font-family:var(--display);font-size:clamp(22px,4vw,30px);font-weight:700;letter-spacing:-.01em}
.topic .ctx{color:var(--muted);font-size:14px}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}

.rail{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rail .node{font-size:12px;padding:4px 9px;border-radius:5px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2)}
.rail .node.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.rail .arrow{color:var(--muted);font-size:12px}

.steps{display:grid;gap:12px}
.step{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);display:grid;gap:8px}
.step.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.step-head{display:flex;gap:10px;align-items:baseline}
.step-head .n{font-family:var(--mono);font-size:12px;color:var(--accent)}
.step-head h3{font-size:18px}
.step .prompt{font-size:15px;color:var(--muted)}
.sphr{display:flex;flex-wrap:wrap;gap:6px}
.sphr span{background:var(--surface-2);border-radius:6px;padding:4px 10px;font-size:13.5px}
.wc{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;min-height:1em}
.phrases{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.phrase{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.phrase small{display:block;color:var(--muted);font-size:12px}

.status{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.status.err{color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}

.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.score{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.score .v{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.score .v small{font-size:13px;color:var(--muted);font-weight:500}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.fb-sec{display:grid;gap:8px}
.fb-sec h3{font-size:17px}
ul.clean{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fix{border-left:3px solid var(--line);padding:4px 0 4px 12px;display:grid;gap:3px}
.fix .old{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--muted)}
.fix .new{font-weight:700}
.fix small{color:var(--muted)}
.polished{background:var(--surface-2);border-radius:8px;padding:14px 16px;line-height:1.75}
mark{background:var(--marker);color:var(--marker-ink);padding:0 2px;border-radius:2px}

/* read-aloud script */
.script{display:grid;gap:4px;counter-reset:sent}
.sent{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:8px}
.sent.playing{background:var(--accent-soft)}
.sent .play{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:11px;display:grid;place-items:center;padding:0}
.sent .play:hover{border-color:var(--accent);color:var(--accent)}
.sent .txt{font-size:18px;line-height:1.9;word-spacing:.08em}
.lk{color:var(--link);font-weight:700;margin-inline:-.12em;display:inline-block;transform:translateY(.28em);font-size:1.1em;line-height:0}
.ps{color:var(--muted);margin-inline:.25em;font-weight:400}
.st{background:var(--stress-bg);border-radius:3px;padding:0 2px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span b{font-weight:700}

.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.word{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;align-content:start}
.word .w{font-family:var(--display);font-weight:700;font-size:17px}
.word .m{font-size:14px}
.word .ex{font-size:13px;font-style:italic;color:var(--muted)}
.word .acts{display:flex;gap:12px}
.word .acts button{border:0;background:transparent;color:var(--accent);font-size:13px;padding:0;font-weight:700}
.word .acts button:disabled{color:var(--muted);cursor:default}

details.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
details.box summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.box summary::-webkit-details-marker{display:none}
details.box[open] summary{margin-bottom:12px}
.nb-item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding-block:8px;border-top:1px solid var(--line)}
.nb-item:first-child{border-top:0}
.nb-item .x{border:0;background:transparent;color:var(--muted);font-size:13px}
.hist{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding-block:6px;border-top:1px solid var(--line);font-size:14px}
.hist:first-child{border-top:0}
.hist .d{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}

/* charts: categorical slots 1-3 from the validated reference palette */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181}
.typepick{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.tchip{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;text-align:left;display:grid;gap:1px}
.tchip b{font-size:14px}
.tchip small{font-size:11.5px;color:var(--muted)}
.tchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tchip[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.ctype{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);flex-basis:100%}
.ctitle{flex:1 1 auto}
.cbig{fill:var(--ink);font-size:26px;font-weight:700;font-family:var(--display)}
.dwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.dwrap svg.donut{width:220px;max-width:100%;flex:none}
.dlist{list-style:none;margin:0;padding:0;display:grid;gap:8px;flex:1 1 200px}
.dlist li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.dlist b{font-variant-numeric:tabular-nums}
.lbl{fill:var(--ink)!important;font-weight:700!important}
.ctip-read{margin:0;font-size:14px;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.chart{margin:0;display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.chead{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:baseline}
.chead .legend{margin-left:auto}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.cbox{position:relative}
.cbox svg{display:block;width:100%;height:auto;overflow:visible}
.cgrid{stroke:var(--line);stroke-width:1}
.cax{stroke:var(--muted);stroke-width:1}
.ctick{fill:var(--muted);font-size:12px;font-family:var(--body);font-variant-numeric:tabular-nums}
.cl{fill:var(--ink);font-size:14px;font-family:var(--body)}
.cv{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--body);font-variant-numeric:tabular-nums}
.cv.sm{font-size:11px;font-weight:400;fill:var(--muted)}
.cann{fill:var(--muted);font-size:12px;font-family:var(--body)}
.cmark,.cref{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.ccross{stroke:var(--muted);stroke-width:1}
.ctip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:120px;display:grid;gap:2px}
.ctip .tt{color:var(--muted);font-size:12px}
.cdata summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:700}
.tscroll{overflow-x:auto;margin-top:8px}
.ctable{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.ctable th,.ctable td{padding:4px 12px 4px 0;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.ctable th:first-child,.ctable td:first-child{text-align:left}

@media (max-width:560px){
  .modes{grid-template-columns:1fr}
  .scores{grid-template-columns:repeat(2,1fr)}
  .panel{padding:16px}
  .sent .txt{font-size:17px}
}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Frame <span>&amp;</span> Speak</h1>
      <small data-t="tagline"></small>
    </div>
    <div class="seg" role="group" aria-label="Section">
      <button id="langZh" aria-pressed="false">中文</button>
      <button id="langEn" aria-pressed="true">English</button>
    </div>
  </header>

  <div class="modes" role="group">
    <button class="mode" id="modeDraw" aria-pressed="true"><b data-t="drawTitle"></b><small data-t="drawSub"></small></button>
    <button class="mode" id="modeFree" aria-pressed="false"><b data-t="freeTitle"></b><small data-t="freeSub"></small></button>
  </div>

  <main class="stack">
    <section class="panel stack" id="drawPanel">
      <div class="row between">
        <div class="row" role="group">
          <button class="chip" id="deckLife" aria-pressed="false" data-t="life"></button>
          <button class="chip" id="deckWork" aria-pressed="true" data-t="work"></button>
          <button class="chip" id="deckChart" aria-pressed="false" data-t="charts"></button>
        </div>
        <div class="row">
          <button class="btn" id="drawBtn" data-t="drawAnother"></button>
        </div>
      </div>
      <div class="typepick" id="typeRow" hidden>
        <div class="label" data-t="pickType"></div>
        <div class="types" id="typeChips" role="group"></div>
      </div>
    </section>

    <section class="panel stack" id="freePanel" hidden>
      <label for="scenario" class="stack" style="gap:6px">
        <b data-t="describe"></b>
        <textarea id="scenario" rows="3"></textarea>
      </label>
      <div class="row between">
        <div class="row" id="exampleChips"></div>
        <button class="btn primary" id="buildBtn" data-t="build"></button>
      </div>
      <div class="status" id="buildStatus" hidden></div>
    </section>

    <section class="panel stack" id="topicPanel">
      <div class="topic">
        <div class="row"><span class="tag" id="fwTag"></span><span class="note" id="fwWhy"></span></div>
        <div class="q" id="topicQ"></div>
        <div class="ctx" id="topicCtx" hidden></div>
      </div>
        <figure class="chart" id="chart" hidden></figure>
      <div class="rail" id="rail"></div>
    </section>

    <section class="steps" id="steps"></section>

    <section class="panel stack" id="phrasePanel" hidden>
      <div class="label" data-t="phrases"></div>
      <div class="phrases" id="phrases"></div>
    </section>

    <section class="panel stack">
      <div class="row between">
        <div>
          <b data-t="sayIt"></b>
          <div class="note" data-t="stuck"></div>
        </div>
        <div class="row">
          <button class="btn ghost" id="clearBtn" data-t="clear"></button>
          <button class="btn primary" id="feedbackBtn" data-t="getFb"></button>
        </div>
      </div>
      <div class="status" id="fbStatus" hidden></div>
    </section>

    <section class="panel stack" id="fbPanel" hidden aria-live="polite"></section>

    <details class="box">
      <summary><span data-t="notebook"></span><span class="label" id="nbCount">0</span></summary>
      <div id="nbList"></div>
    </details>

    <details class="box">
      <summary><span data-t="history"></span><span class="label" id="histCount">0</span></summary>
      <div id="histList"></div>
    </details>

    <p class="note" data-t="aiNote"></p>
  </main>
</div>

/* ---------- storage ---------- */
const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* ---------- state: one independent section per language ---------- */
function freshSection(lang){ return {deck:"work", idx:0, guide:guideFromDeck(lang,"work",0), answers:[], feedback:null, scenario:""}; }
let app = LS.get("fs.v2", null);
if(!app || !app.sec){ app = {lang:"en", mode:"draw", sec:{en:freshSection("en"), zh:freshSection("zh")}}; }
const L = () => app.lang;
const S = () => app.sec[app.lang];
const t = k => T[L()][k];
function persist(){ LS.set("fs.v2", app); }

function guideFromDeck(lang, deck, idx){
  const row = DECK[deck][idx]; const F = FRAMEWORKS[row[2]][lang];
  return {source:"deck", fw:row[2], deck, topic: lang==="en"?row[0]:row[1], context:"", framework:F.name, why:F.use,
    steps:F.steps.map(([label,prompt],k)=>({label,prompt,phrases: row[2]==="DATA" && row[3] ? (DATA_STEP_PH[lang][k] || CHART_TYPES[row[3].type]?.ph[lang] || []) : (FW_PH[row[2]]?.[lang]?.[k] || [])})),
    chart: row[3]||null, phrases:[]};
}

/* ---------- dom ---------- */
const $ = id => document.getElementById(id);
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class") el.className=v; else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(v!==false && v!=null) el.setAttribute(k,v===true?"":v);
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false) continue; el.append(kid.nodeType?kid:String(kid)); }
  return el;
}
function setStatus(el, text, kind){
  el.hidden = !text; el.className = "status" + (kind==="err"?" err":"");
  el.replaceChildren(); if(!text) return;
  if(kind==="busy") el.append(h("span",{class:"dot"}));
  el.append(h("span",{},text));
}
function countText(v){
  v = (v||"").trim(); if(!v) return "";
  if(L()==="zh"){ const n=(v.match(/[一-鿿]/g)||[]).length; return n+" 字"; }
  return (v.match(/[A-Za-z']+/g)||[]).length+" words";
}

/* ---------- render ---------- */
function renderChrome(){
  document.documentElement.lang = L()==="zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = t(el.dataset.t); });
  $("scenario").placeholder = t("scenarioPh");
  $("scenario").value = S().scenario||"";
  $("langZh").setAttribute("aria-pressed", L()==="zh");
  $("langEn").setAttribute("aria-pressed", L()==="en");
  $("modeDraw").setAttribute("aria-pressed", app.mode==="draw");
  $("modeFree").setAttribute("aria-pressed", app.mode==="free");
  $("drawPanel").hidden = app.mode!=="draw";
  $("freePanel").hidden = app.mode!=="free";
  $("deckLife").setAttribute("aria-pressed", S().deck==="life");
  $("deckWork").setAttribute("aria-pressed", S().deck==="work");
  $("deckChart").setAttribute("aria-pressed", S().deck==="chart");
  renderTypeChips();
  const ex = $("exampleChips"); ex.replaceChildren();
  EXAMPLES[L()].forEach(([label,text])=>ex.append(h("button",{class:"chip",type:"button",onclick:()=>{$("scenario").value=text;S().scenario=text;persist();}}, label)));
  ["buildStatus","fbStatus"].forEach(id=>setStatus($(id),""));
}

function renderGuide(){
  const g = S().guide;
  $("fwTag").textContent = g.framework;
  $("fwWhy").textContent = g.why||"";
  $("topicQ").textContent = g.topic;
  $("topicCtx").hidden = !g.context; $("topicCtx").textContent = g.context||"";
  renderChart(g.chart||null);
  const steps = $("steps"); steps.replaceChildren();
  g.steps.forEach((s,i)=>{
    const ta = h("textarea",{id:"ans"+i, rows:"2"});
    ta.value = S().answers[i]||"";
    const wc = h("div",{class:"wc"}, countText(ta.value));
    const card = h("article",{class:"step"},
      h("div",{class:"step-head"}, h("span",{class:"n"}, String(i+1).padStart(2,"0")), h("h3",{}, s.label)),
      h("div",{class:"prompt"}, s.prompt),
      s.phrases?.length ? h("div",{class:"sphr"}, s.phrases.map(x=>h("span",{}, x))) : null,
      ta, wc);
    ta.addEventListener("focus",()=>{document.querySelectorAll(".step").forEach(x=>x.classList.remove("active")); card.classList.add("active");});
    ta.addEventListener("input",()=>{S().answers[i]=ta.value; wc.textContent=countText(ta.value); renderRail(); persist();});
    steps.append(card);
  });
  renderRail();
  $("phrasePanel").hidden = !(g.phrases&&g.phrases.length);
  $("phrases").replaceChildren(...(g.phrases||[]).map(p=>h("div",{class:"phrase"}, p.text, p.note?h("small",{},p.note):null)));
}
function renderRail(){
  const r = $("rail"); r.replaceChildren();
  S().guide.steps.forEach((s,i)=>{
    if(i) r.append(h("span",{class:"arrow"},"→"));
    r.append(h("span",{class:"node"+((S().answers[i]||"").trim()?" done":"")}, s.label));
  });
}
function setGuide(g){
  const s = S(); s.guide = g; s.answers = new Array(g.steps.length).fill(""); s.feedback=null;
  $("fbPanel").hidden = true; stopSpeech(); persist(); renderChrome(); renderGuide();
}
function renderAll(){
  stopSpeech(); renderChrome(); renderGuide(); renderNotebook(); renderHistory();
  if(S().feedback) renderFeedback(S().feedback); else $("fbPanel").hidden = true;
}

            const v=s.values[i], x=gx+j*(bw+gap), y=yOf(v);
            svg.append(sv("path",{d:roundTop(x,y,bw,Y0-y,4),fill:`var(--s${j+1})`}));
            if(k<=2) svg.append(sv("text",{x:x+bw/2,y:y-5,class:"cv sm","text-anchor":"middle"}, fmtV(c,v)));
          });
        });
      } else if(c.type==="hist"){
        const v = c.series[0].values;
        xs.forEach((_,i)=>{ const x = X0+i*gw+1, y = yOf(v[i]); svg.append(sv("path",{d:roundTop(x,y,gw-2,Y0-y,4),fill:"var(--s1)"})); svg.append(sv("text",{x:x+gw/2-1,y:y-5,class:"cv sm","text-anchor":"middle"}, fmtV(c,v[i]))); });
      } else if(c.type==="stacked"){
        const bw = Math.min(56, gw*0.6);
        xs.forEach((_,i)=>{
          const x = X0+i*gw+(gw-bw)/2; let base = 0;
          c.series.forEach((s,j)=>{
            const top = base + s.values[i], yT = yOf(top), yB = yOf(base), last = j===c.series.length-1;
            const gapTop = last ? 0 : 2;
            svg.append(sv("path",{d: last ? roundTop(x,yT,bw,yB-yT,4) : `M${x},${yT+gapTop}H${x+bw}V${yB}H${x}Z`, fill:`var(--s${j+1})`}));
            base = top;
          });
          svg.append(sv("text",{x:x+bw/2,y:yOf(base)-6,class:"cv sm","text-anchor":"middle"}, fmtV(c,base)));
        });
      } else if(c.type==="waterfall"){
        const v = c.series[0].values, tot = new Set(c.totals), bw = Math.min(56, gw*0.62); let run = 0, prevTop = null;
        xs.forEach((_,i)=>{
          const x = X0+i*gw+(gw-bw)/2; let a, b, fill;
          if(tot.has(i)){ a=0; b=v[i]; run=v[i]; fill="var(--s1)"; }
          else { a=run; b=run+v[i]; run=b; fill = v[i]>=0 ? "var(--s3)" : "var(--s2)"; }
          const yT = yOf(Math.max(a,b)), yB = yOf(Math.min(a,b));
          svg.append(sv("path",{d: (tot.has(i)||v[i]>=0) ? roundTop(x,yT,bw,Math.max(yB-yT,2),3) : roundBottom(x,yT,bw,Math.max(yB-yT,2),3), fill}));
          if(prevTop!=null) svg.append(sv("line",{x1:prevTop.x,x2:x,y1:prevTop.y,y2:prevTop.y,class:"cmark"}));
          prevTop = {x:x+bw, y:yOf(run)};
          svg.append(sv("text",{x:x+bw/2,y:yT-6,class:"cv sm","text-anchor":"middle"}, tot.has(i)?fmtV(c,v[i]):fmtS(c,v[i])));
        });
      }
      xs.forEach((lab,i)=>{
        const r = sv("rect",{x:X0+i*gw,y:Y1,width:gw,height:Y0-Y1,fill:"transparent"});
        if(c.type==="waterfall"){ const tot=new Set(c.totals); hit(r,[h("div",{class:"tt"},lab), h("b",{}, tot.has(i)?fmtV(c,c.series[0].values[i]):fmtS(c,c.series[0].values[i]))]); }
        else if(c.type==="stacked") hit(r, [...tipRows(i), h("div",{class:"tt"}, (lang==="zh"?"合计 ":"Total ") + fmtV(c, c.series.reduce((a,s)=>a+s.values[i],0)))]);
        else hit(r, tipRows(i));
        svg.append(r);
      });
    }
  }
  if(svg){ svg.setAttribute("role","img"); svg.setAttribute("aria-label", c.title[lang]); box.append(svg, tip); }

  /* data table */
  let thead, rowsData;
  if(c.type==="scatter"){ thead = ["", c.axes.x[lang], c.axes.y[lang]]; rowsData = c.points.map(p=>[p[0], fmtN(c.fmtX,p[1],0), fmtN(c.fmt,p[2],0)]); }
  else if(c.type==="heatmap"){ thead = ["", ...xs]; rowsData = c.rows[lang].map((r,i)=>[r, ...c.grid[i].map(v=>v==null?"–":fmtV(c,v))]); }
  else if(c.type==="waterfall"){ const tot=new Set(c.totals); thead=["", c.series[0].name[lang]]; rowsData = xs.map((x,i)=>[x, tot.has(i)?fmtV(c,c.series[0].values[i]):fmtS(c,c.series[0].values[i])]); }
  else { thead = ["", ...c.series.map(s=>s.name[lang])]; rowsData = xs.map((x,i)=>[x, ...c.series.map(s=>c.type==="diverge"?fmtS(c,s.values[i]):fmtV(c,s.values[i]))]); }
  const table = h("table",{class:"ctable"}, h("thead",{}, h("tr",{}, thead.map(t=>h("th",{}, t)))), h("tbody",{}, rowsData.map(r=>h("tr",{}, r.map(v=>h("td",{}, v))))));
  if(ty) fig.append(h("p",{class:"ctip-read"}, h("b",{}, lang==="zh"?"怎么讲这类图：":"How to talk about it: "), ty.tip[lang]));
  fig.append(h("details",{class:"cdata"}, h("summary",{}, t("showData")), h("div",{class:"tscroll"}, table)));
}

let samplePromise = null;
function getSample(){ if(!samplePromise) samplePromise = (window.claude?.use ? window.claude.use("sample") : Promise.resolve(null)).catch(()=>null); return samplePromise; }
function errCopy(e){
  const E = t("err");
  switch(e?.code){
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed": return E.off;
    case "rate_limited": return E.rate;
    case "session_expired": return E.sign;
    case "invalid_json": return E.json;
    case "refused": return E.refused;
    default: return E.other;

const GUIDE_SHAPE = `{"topic":"the exact question to answer out loud, one sentence","context":"who they speak to and the setting, one short line","framework":"short framework name","why":"why this framework fits, very short","steps":[{"label":"short step name","prompt":"a guiding question written for THIS situation","phrases":["useful expression for this step","...","..."]}]}`;
const FW_MENU = `PREP (point-reason-example-point, for opinions), STAR (situation-task-action-result, for stories about something they did), Problem-Solution-Benefit-Next step (for requests, proposals, pushing back), Past-Present-Future (for introductions and changes), What-So what-Now what (for reflection or explaining what happened), or a custom 3-5 step framework when none fits (e.g. small talk: Open-Ask-Share-Bridge; a toast: Hook-Story-Wish)`;

async function buildGuide(scenario){
  const en = L()==="en";
  const coach = en
    ? `You are a speaking coach for a Chinese-native professional who wants to speak English with clear structure. Write EVERYTHING in natural spoken English (no Chinese at all).`
    : `你是一位中文表达教练，帮助一位职场人士在中文口头表达中做到有条理、有重点、得体。所有内容都用中文写。框架名用中文（例如“观点·理由·例子·重申”）。`;
  const task = `The learner described a real situation they will face (may be written in either language):\n"""${scenario}"""\nTurn it into ONE speaking task to rehearse. Choose the best-fitting framework: ${FW_MENU}.`;
  const prompt = `${coach}\n${task}\nRules: 3-5 steps. For each step give 2-3 expressions a skilled speaker would really use at that point in this situation (natural, not textbook; use "…" where content goes). Keep prompts short.\nReply with only JSON in this shape:\n${GUIDE_SHAPE}`;
  const sample = await getSample();
  if(!sample) throw {code:"not_granted"};
  const g = await sample.json(prompt, {cache:false});
  if(!g || !Array.isArray(g.steps) || !g.steps.length || !g.topic) throw {code:"invalid_json"};
  return {source:"free", topic:String(g.topic), context:String(g.context||""), framework:String(g.framework||""), why:String(g.why||""),
    steps:g.steps.slice(0,6).map(s=>({label:String(s.label||""),prompt:String(s.prompt||""),phrases:(Array.isArray(s.phrases)?s.phrases:[]).slice(0,4).map(String)})),
    phrases:(Array.isArray(g.phrases)?g.phrases:[]).slice(0,8).map(p=>({text:String(p.text||""),note:String(p.note||"")}))};
}

async function getFeedback(){

  const body = g.steps.map((s,i)=>`[${s.label}] ${S().answers[i]||"(empty)"}`).join("\n");

  const head = `${chartNote}Task: ${g.topic}\n${g.context?"Setting: "+g.context+"\n":""}Framework: ${g.framework} (${g.steps.map(s=>s.label).join(" → ")})\nTheir answer, by step:\n${body}\n`;
  const prompt = en ? `You are a warm but exacting English speaking coach for a Chinese-native professional. Write all feedback in clear, simple English (no Chinese except when quoting them). Parts of their answer may be in Chinese where they didn't know the English; treat those as "how do I say this" requests.

${head}
Scores are 1-5 integers: structure (each step does its job and flows), clarity (easy to follow when heard once), vocabulary (range and precision), naturalness (sounds like spoken English, not translated).
"fixes": up to 5 most useful corrections: quote their exact words in "original", a natural spoken alternative in "better", a short reason in "why".
"translations": each Chinese fragment they wrote ("from") with a natural English way to say it ("to"); empty array if none.
"polished": their answer rewritten as one natural spoken paragraph, keeping their ideas and details, in framework order, 90-160 words. Wrap 4-6 upgraded words or phrases in **double asterisks**.
"speech": the SAME polished text split into sentences, marked for reading aloud: put "‿" between words whose sounds link in connected speech (consonant-to-vowel like "pick‿it‿up", same consonant like "big‿game", and common reductions like "want‿to"), put " / " at natural short pauses inside a sentence, and wrap the 1-3 most stressed words of each sentence in *single asterisks*. No double asterisks here.
"vocab": 5 words or phrases worth learning, with part of speech (or "phrase"), a short plain-English "meaning", and an example sentence tied to their situation.
"next": one concrete thing to focus on next time.
Reply with only JSON:
{"scores":{"structure":0,"clarity":0,"vocabulary":0,"naturalness":0},"summary":"","strengths":[""],"fixes":[{"original":"","better":"","why":""}],"translations":[{"from":"","to":""}],"polished":"","speech":["I've *been* work‿ing on‿it / for‿a *while*."],"vocab":[{"word":"","pos":"","meaning":"","example":""}],"next":""}`
  : `你是一位温和但要求严格的中文表达教练，帮助职场人士把话说得有条理、有重点、得体、自然。全部用中文反馈。

${head}
评分为 1-5 的整数：structure（每一步是否完成其作用、衔接是否顺畅），clarity（听一遍能否听懂重点），vocabulary（用词是否准确、丰富、有表现力），naturalness（是否像自然口语，而不是书面腔或翻译腔）。
"fixes"：最多 5 条最有价值的修改，"original" 原样引用他写的句子，"better" 给出更好的说法，"why" 简短说明原因（如啰嗦、口头禅、逻辑跳跃、用词不准、语气不得体）。
"translations"：他夹杂的英文词（from）及地道的中文说法（to）；没有则为空数组。
"polished"：把他的回答改写成一段自然、有感染力的口语，保留他的观点和细节，按框架顺序，150-280 字。用 **双星号** 标出 4-6 个升级后的好词或好句。
"speech"：把同一段示范回答按句拆开，作为朗读稿：在句内自然停顿处加 " / "，每句中最需要重读的 1-3 个词用 *单星号* 标出。这里不要用双星号。
"vocab"：5 个值得积累的好词、成语或句式，"pos" 写词性或“成语”“句式”，"meaning" 写简短释义，"example" 给一个贴合他场景的例句。
"next"：下次练习最该注意的一点。
只回复 JSON：
{"scores":{"structure":0,"clarity":0,"vocabulary":0,"naturalness":0},"summary":"","strengths":[""],"fixes":[{"original":"","better":"","why":""}],"translations":[{"from":"","to":""}],"polished":"","speech":["我觉得 / 这件事 *最关键* 的是……"],"vocab":[{"word":"","pos":"","meaning":"","example":""}],"next":""}`;
  const sample = await getSample();
  if(!sample) throw {code:"not_granted"};
  return sample.json(prompt, {cache:false});
}

/* ---------- speech ---------- */
let rate = LS.get("fs.rate", 1);
let playToken = 0;
const plain = s => String(s).replace(/‿/g," ").replace(/\s\/\s?/g,", ").replace(/\*+/g,"").replace(/\s+/g," ").replace(/,\s*([,.!?。，！？])/g,"$1").trim();
function pickVoice(lang){
  try{
    const vs = speechSynthesis.getVoices(); const want = lang==="zh" ? /^zh(-|_)?(CN|Hans)?/i : /^en(-|_)US/i;
    const pool = vs.filter(v=>want.test(v.lang)); const fallback = vs.filter(v=>v.lang.toLowerCase().startsWith(lang));
    const list = pool.length ? pool : fallback;
    return list.find(v=>/Samantha|Ava|Allison|Google US|Tingting|Meijia|Google 普通话/i.test(v.name)) || list.find(v=>v.localService) || list[0] || null;
  }catch(e){ return null; }
}
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = ()=>{}; }catch(e){}
function stopSpeech(){ playToken++; try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll(".sent.playing").forEach(x=>x.classList.remove("playing")); const pa=$("playAllBtn"); if(pa) pa.textContent=t("playAll"); }
function sayOne(text, lang){
  return new Promise(res=>{
    try{
      const u = new SpeechSynthesisUtterance(text); u.lang = lang==="zh"?"zh-CN":"en-US"; u.rate = rate;
      const v = pickVoice(lang); if(v) u.voice = v;
      u.onend = res; u.onerror = res; speechSynthesis.speak(u);
    }catch(e){ res(); }
  });
}
async function playSentences(rows, from, to){
  stopSpeech(); const my = ++playToken; const lang = L();
  if(to-from>1){ const pa=$("playAllBtn"); if(pa) pa.textContent=t("stop"); }
  for(let i=from;i<to;i++){
    if(my!==playToken) return;
    rows[i].el.classList.add("playing");
    await sayOne(rows[i].text, lang);
    rows[i].el.classList.remove("playing");
  }
  if(my===playToken){ const pa=$("playAllBtn"); if(pa) pa.textContent=t("playAll"); }
}
function markedNode(s){
  const span = h("span",{class:"txt"});
  String(s).split(/(\*[^*]+\*|‿|\s\/\s?)/g).forEach(part=>{
    if(!part) return;
    if(part==="‿") span.append(h("span",{class:"lk","aria-hidden":"true"},"‿"));
    else if(/^\s\/\s?$/.test(part)) span.append(h("span",{class:"ps","aria-hidden":"true"}," / "));
    else if(/^\*[^*]+\*$/.test(part)) span.append(h("strong",{class:"st"}, part.slice(1,-1)));
    else span.append(part);
  });
  return span;
}

function renderFeedback(f){

  p.append(h("div",{class:"row between"}, h("h2",{style:"font-size:22px"}, t("feedback")), h("span",{class:"label"}, S().guide.framework)));

    return h("div",{class:"score"}, h("div",{class:"label"}, t("dims")[i]), h("div",{class:"v"}, v, h("small",{}," / 5")), h("div",{class:"bar"}, h("i",{style:`width:${v*20}%`})));
  })));

  const strengths = (f.strengths||[]).map(s=>typeof s==="string"?s:(s.en||s.text||"")).filter(Boolean);
  if(strengths.length) p.append(h("div",{class:"fb-sec"}, h("h3",{}, t("worked")), h("ul",{class:"clean"}, strengths.map(s=>h("li",{}, "✓ ", s)))));

  if(f.fixes?.length) p.append(h("div",{class:"fb-sec"}, h("h3",{}, t("better")),
    h("ul",{class:"clean"}, f.fixes.map(x=>h("li",{class:"fix"}, h("span",{class:"old"}, x.original), h("span",{class:"new"}, "→ ", x.better), x.why?h("small",{}, x.why):null)))));

  if(f.translations?.length) p.append(h("div",{class:"fb-sec"}, h("h3",{}, t("translations")),
    h("ul",{class:"clean"}, f.translations.map(x=>h("li",{class:"fix"}, h("span",{}, x.from), h("span",{class:"new"}, "→ ", x.to))))));

  if(f.polished){
    const pol = h("div",{class:"polished"});
    String(f.polished).split(/\*\*(.+?)\*\*/g).forEach((part,i)=> pol.append(i%2? h("mark",{},part) : part));
    p.append(h("div",{class:"fb-sec"}, h("h3",{}, t("polished")), pol));
  }

  const speech = (Array.isArray(f.speech)?f.speech:[]).map(String).filter(s=>s.trim());
  if(speech.length){
    const canSpeak = "speechSynthesis" in window;
    const rows = []; const script = h("div",{class:"script"});
    speech.forEach((s,i)=>{
      const btn = h("button",{class:"play",type:"button","aria-label":`${t("listen")} ${i+1}`, disabled:!canSpeak},"▶");
      const el = h("div",{class:"sent"}, btn, markedNode(s));
      rows.push({el, text:plain(s)});
      btn.onclick = ()=>playSentences(rows, i, i+1);
      script.append(el);
    });
    const playAll = h("button",{class:"btn primary",type:"button",id:"playAllBtn",disabled:!canSpeak}, t("playAll"));
    playAll.onclick = ()=>{ if(playAll.textContent===t("stop")) stopSpeech(); else playSentences(rows, 0, rows.length); };
    const speedSeg = h("div",{class:"seg sm",role:"group","aria-label":t("speed")});
    [0.75,0.9,1].forEach(r=>{
      const b = h("button",{type:"button","aria-pressed":String(rate===r)}, r+"×");
      b.onclick = ()=>{ rate=r; LS.set("fs.rate",r); speedSeg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); };
      speedSeg.append(b);
    });
    p.append(h("div",{class:"fb-sec"},
      h("div",{class:"row between"}, h("h3",{}, t("readAloud")), h("div",{class:"row"}, h("span",{class:"label"}, t("speed")), speedSeg, playAll)),
      h("div",{class:"legend"}, t("legend").map(([sym,desc])=>h("span",{}, sym==="‿"?h("b",{style:"color:var(--link)"},"‿"):sym==="/"?h("b",{},"/"):h("strong",{class:"st"},sym), " ", desc))),
      script,
      h("div",{class:"note"}, canSpeak ? t("shadow") : t("noVoice"))));
  }

  if(f.vocab?.length){
    const have = new Set(notebook.filter(w=>w.lang===L()).map(w=>String(w.word).toLowerCase()));
    p.append(h("div",{class:"fb-sec"}, h("h3",{}, t("words")),
      h("div",{class:"vocab"}, f.vocab.map(v=>{
        const got = have.has(String(v.word).toLowerCase());
        const add = h("button",{type:"button",disabled:got}, got ? t("inNb") : t("add"));
        add.onclick = async ()=>{ add.disabled=true; add.textContent=t("inNb"); await addWord(v); };
        const lis = h("button",{type:"button"}, "▶ "+t("listen"));
        lis.onclick = ()=>{ stopSpeech(); sayOne(`${v.word}. ${v.example||""}`, L()); };
        return h("div",{class:"word"}, h("div",{class:"w"}, v.word, " ", h("span",{class:"label"}, v.pos||"")),
          h("div",{class:"m"}, v.meaning||v.zh||""), h("div",{class:"ex"}, v.example||""),
          h("div",{class:"acts"}, "speechSynthesis" in window ? lis : null, add));
      }))));
  }
  if(f.next) p.append(h("div",{class:"fb-sec"}, h("h3",{}, t("next")), h("p",{style:"margin:0"}, f.next)));
}

  const g=sec.guide;
  const item = {lang, topic:g.topic, framework:g.framework, scores:sc, avg:vals.reduce((a,b)=>a+b,0)/4,
    answers:g.steps.map((s,i)=>({step:s.label, text:sec.answers[i]||""})), polished:String(f.polished||""), at:Date.now()};
  sessLog = [item, ...sessLog].slice(0,200); LS.set("fs.sessions2", sessLog); renderHistory();
  if(db){ try{ await db.collection("sessions").add(item); }catch(e){} }
}
async function initDb(){
  try{ db = window.claude?.use ? await window.claude.use("db") : null; }catch(e){ db=null; }
  if(!db) return;
  try{
    const ws = await db.collection("words").orderBy("at","desc").limit(500).get();
    if(!ws.empty){ notebook = ws.docs.map(d=>{ const x={...d.data(), id:d.id}; if(!x.lang) x.lang="en"; if(!x.meaning&&x.zh) x.meaning=x.zh; return x; }); LS.set("fs.words2", notebook); renderNotebook(); }
    const ss = await db.collection("sessions").orderBy("at","desc").limit(100).get();
    if(!ss.empty){ sessLog = ss.docs.map(d=>{ const x={...d.data()}; if(!x.lang) x.lang="en"; if(!x.topic) x.topic=x.topic_en||""; return x; }); LS.set("fs.sessions2", sessLog); renderHistory(); }
  }catch(e){}
}

/* ---------- wiring ---------- */
$("langZh").onclick=()=>{ if(L()!=="zh"){ app.lang="zh"; persist(); renderAll(); } };
$("langEn").onclick=()=>{ if(L()!=="en"){ app.lang="en"; persist(); renderAll(); } };
$("modeDraw").onclick=()=>{app.mode="draw";persist();renderChrome();};
$("modeFree").onclick=()=>{app.mode="free";persist();renderChrome();$("scenario").focus();};
function chartPool(kind){ return DECK.chart.map((r,i)=>i).filter(i=>!kind || kind==="all" || DECK.chart[i][3].type===kind); }
function draw(deck){
  const s=S();
  const pool = deck==="chart" ? chartPool(s.chartKind) : DECK[deck].map((_,i)=>i);
  let i, tries=0;
  do{ i = pool[Math.floor(Math.random()*pool.length)]; }while(pool.length>1 && deck===s.deck && i===s.idx && ++tries<20);
  s.deck=deck; s.idx=i; setGuide(guideFromDeck(L(),deck,i));
}
function renderTypeChips(){
  const s=S(); $("typeRow").hidden = s.deck!=="chart";
  if(s.deck!=="chart") return;
  const kind = s.chartKind||"all", lang=L();
  const mk = (k, label, sub) => { const b = h("button",{class:"tchip",type:"button","aria-pressed":String(kind===k)}, h("b",{},label), sub?h("small",{},sub):null); b.onclick=()=>{ s.chartKind=k; draw("chart"); }; return b; };
  $("typeChips").replaceChildren(mk("all", t("allTypes"), lang==="zh"?"随机":"Surprise me"), ...CHART_ORDER.map(k=>mk(k, CHART_TYPES[k][lang], CHART_TYPES[k].cat[lang])));
}
$("deckLife").onclick=()=>draw("life");
$("deckWork").onclick=()=>draw("work");
$("deckChart").onclick=()=>draw("chart");
$("drawBtn").onclick=()=>draw(S().deck);
$("scenario").addEventListener("input",e=>{S().scenario=e.target.value;persist();});

async function runGuide(btn, statusEl, scenario){
  btn.disabled=true; setStatus(statusEl, t("writingGuide"), "busy");
  try{ const g = await buildGuide(scenario); setGuide(g); $("topicPanel").scrollIntoView({behavior:"smooth",block:"start"}); }
  catch(e){ setStatus(statusEl, errCopy(e), "err"); }
  finally{ btn.disabled=false; }
}
$("buildBtn").onclick=()=>{
  const s=$("scenario").value.trim();
  if(!s){ setStatus($("buildStatus"), t("needScenario"), "err"); return; }
  runGuide($("buildBtn"), $("buildStatus"), s);
};
$("clearBtn").onclick=()=>{ S().answers = S().answers.map(()=>""); persist(); renderGuide(); };
$("feedbackBtn").onclick=async()=>{
  const filled = S().answers.filter(a=>(a||"").trim()).length;
  if(!filled){ setStatus($("fbStatus"), t("needAnswer"), "err"); return; }
  const btn=$("feedbackBtn"); btn.disabled=true; setStatus($("fbStatus"), t("reviewing"), "busy");
  const lang = L();
  try{
    const f = await getFeedback();
    if(!f || typeof f!=="object") throw {code:"invalid_json"};
    app.sec[lang].feedback=f; persist();
    if(L()===lang){ renderFeedback(f); setStatus($("fbStatus"),""); $("fbPanel").scrollIntoView({behavior:"smooth",block:"start"}); }
    logSession(f, lang);
  }catch(e){ if(L()===lang) setStatus($("fbStatus"), errCopy(e), "err"); }
  finally{ btn.disabled=false; }
};

/* ---------- boot ---------- */
renderAll();
initDb();
</script>
